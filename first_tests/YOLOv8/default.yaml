# default.yaml - YOLOv8 Pruning & Fine-tuning Configuration

# --- Core Training Settings ---
task: detect          # YOLO task
mode: train           # YOLO mode
imgsz: 320            # Reduced from 640. Cuts compute by ~58%
batch: 32             # Since we lowered imgsz, you can likely double the batch size to push the GPU harder
device: cpu             # GPU device index (use '' for CPU, '0' for first GPU)
cache: ram            # Loads all 8000 images into RAM for instant batching
amp: True             # Forces Automatic Mixed Precision
workers: 8            # Number of CPU workers for data loading

# --- Optimizer & Learning Rate ---
optimizer: auto       # Optimizer (SGD, Adam, AdamW, or auto)
lr0: 0.005            # Initial learning rate (slightly lower than default 0.01 for fine-tuning)
lrf: 0.01             # Final learning rate fraction
momentum: 0.937       # Optimizer momentum
weight_decay: 0.0005  # Weight decay for regularization

# --- Augmentations (kept moderate to prevent underfitting during recovery) ---
mosaic: 1.0           # Mosaic data augmentation probability
close_mosaic: 10      # Disable mosaic in the last X epochs to stabilize fine-tuning
mixup: 0.0            # Mixup augmentation probability

# --- Loss Weights ---
box: 7.5              # Box loss gain
cls: 0.5              # Class loss gain
dfl: 1.5              # DFL (Distribution Focal Loss) gain